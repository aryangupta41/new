name: molecool
description: A fun 3D molecule builder app with FreeLab and Learning modes.
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: '>=3.0.0 <4.0.0'
  flutter: ">=3.10.0"

dependencies:
  flutter:
    sdk: flutter

  # 3D Graphics
  
  

  # State Management
  provider: ^6.0.0

  # Animations
  animations: ^2.0.0

  # UI Components
  cupertino_icons: ^1.0.0

  # Utils
  vector_math: ^2.1.4

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^3.0.0

flutter:
  uses-material-design: true
 

  # For custom fonts (optional)
  # fonts:
